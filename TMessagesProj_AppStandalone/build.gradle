apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

// Debug checks can still use the upstream compile-only identity. Standalone
// builds require their own app identity, Firebase configuration and key.
def miugramApplicationId = System.getenv('MIUGRAM_ANDROID_APPLICATION_ID') ?: APP_PACKAGE
def miugramStorePath = System.getenv('MIUGRAM_ANDROID_KEYSTORE_PATH')
def miugramStorePassword = System.getenv('MIUGRAM_ANDROID_KEYSTORE_PASSWORD')
def miugramKeyAlias = System.getenv('MIUGRAM_ANDROID_KEY_ALIAS')
def miugramKeyPassword = System.getenv('MIUGRAM_ANDROID_KEY_PASSWORD') ?: miugramStorePassword

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = miugramApplicationId


    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }

        release {
            if (miugramStorePath) {
                storeFile file(miugramStorePath)
            }
            storePassword miugramStorePassword
            keyAlias miugramKeyAlias
            keyPassword miugramKeyPassword
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".web"
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-23' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49', 'twidget'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}

apply plugin: 'com.google.gms.google-services'

// Refuse to assemble any standalone variant with the public upstream key or
// application identity. A configured API pair is mandatory for real login.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase(Locale.ROOT).contains('standalone') }) {
        if (!miugramStorePath || !file(miugramStorePath).isFile() || !miugramStorePassword || !miugramKeyAlias || !miugramKeyPassword) {
            throw new GradleException('Miugram standalone builds require a private signing keystore and credentials')
        }
        if (miugramApplicationId == APP_PACKAGE || miugramApplicationId.startsWith('org.telegram.')) {
            throw new GradleException('Miugram standalone builds require an independent application ID and matching Firebase config')
        }
        // The web suffix above is part of the installed package, not the base ID.
        // Reject upstream Firebase even if someone adds a matching client to it.
        def firebaseFile = file('google-services.json')
        if (!firebaseFile.isFile()) {
            throw new GradleException('Miugram standalone builds require an independent Firebase configuration')
        }
        def firebase
        try {
            firebase = new groovy.json.JsonSlurper().parse(firebaseFile)
        } catch (Exception ignored) {
            throw new GradleException('Miugram Firebase configuration is not valid JSON')
        }
        def firebaseProject = firebase?.project_info?.project_id
        def firebaseClients = firebase?.client instanceof List ? firebase.client : []
        def expectedPackage = miugramApplicationId + '.web'
        if (!firebaseProject || firebaseProject == 'tmessages2' || !firebaseClients.any {
            it?.client_info?.android_client_info?.package_name == expectedPackage && it?.client_info?.mobilesdk_app_id
        }) {
            throw new GradleException('Miugram requires its own Firebase project with a client for ' + expectedPackage)
        }
        if (!(System.getenv('MIUGRAM_TELEGRAM_API_ID') ?: '').matches('[1-9][0-9]*') || !(System.getenv('MIUGRAM_TELEGRAM_API_HASH') ?: '').matches('[a-fA-F0-9]{32}')) {
            throw new GradleException('Miugram standalone builds require a Telegram API ID and hash')
        }
    }
}
