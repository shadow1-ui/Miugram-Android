name: Miugram Android debug build

on:
  push:
    branches: ['miugram/bootstrap']
    paths:
      - 'TMessagesProj/**'
      - 'TMessagesProj_AppStandalone/**'
      - 'TMessagesProj_Modules/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.gitmodules'
      - '.github/workflows/miugram-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-latest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-build:
    name: Compile upstream-derived debug APK (not a release)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Compile debug variant
        shell: bash
        env:
          MIUGRAM_TELEGRAM_API_ID: ${{ secrets.MIUGRAM_TELEGRAM_API_ID }}
          MIUGRAM_TELEGRAM_API_HASH: ${{ secrets.MIUGRAM_TELEGRAM_API_HASH }}
        run: |
          test -n "$MIUGRAM_TELEGRAM_API_ID" && test -n "$MIUGRAM_TELEGRAM_API_HASH"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            :TMessagesProj_AppStandalone:assembleAfatDebug --stacktrace
      # Not published: signing, app identity and runtime behavior are not release-ready.
