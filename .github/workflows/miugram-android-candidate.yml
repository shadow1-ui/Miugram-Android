name: Miugram Android signed candidate (not a release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build signed Android candidate for private testing
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build signed candidate (not a public release)
        shell: bash
        env:
          MIUGRAM_TELEGRAM_API_ID: ${{ secrets.MIUGRAM_TELEGRAM_API_ID }}
          MIUGRAM_TELEGRAM_API_HASH: ${{ secrets.MIUGRAM_TELEGRAM_API_HASH }}
          MIUGRAM_ANDROID_APPLICATION_ID: ${{ vars.MIUGRAM_ANDROID_APPLICATION_ID }}
          MIUGRAM_ANDROID_KEYSTORE_B64: ${{ secrets.MIUGRAM_ANDROID_KEYSTORE_B64 }}
          MIUGRAM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MIUGRAM_ANDROID_KEYSTORE_PASSWORD }}
          MIUGRAM_ANDROID_KEY_ALIAS: ${{ secrets.MIUGRAM_ANDROID_KEY_ALIAS }}
          MIUGRAM_ANDROID_FIREBASE_CONFIG_B64: ${{ secrets.MIUGRAM_ANDROID_FIREBASE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          for name in MIUGRAM_TELEGRAM_API_ID MIUGRAM_TELEGRAM_API_HASH MIUGRAM_ANDROID_APPLICATION_ID MIUGRAM_ANDROID_KEYSTORE_B64 MIUGRAM_ANDROID_KEYSTORE_PASSWORD MIUGRAM_ANDROID_KEY_ALIAS MIUGRAM_ANDROID_FIREBASE_CONFIG_B64; do
            if [[ -z ${!name:-} ]]; then echo "Required CI configuration is missing: $name" >&2; exit 1; fi
          done
          umask 077
          export MIUGRAM_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/miugram-signing.p12"
          trap 'rm -f "$MIUGRAM_ANDROID_KEYSTORE_PATH" TMessagesProj_AppStandalone/google-services.json' EXIT
          printf '%s' "$MIUGRAM_ANDROID_KEYSTORE_B64" | base64 --decode > "$MIUGRAM_ANDROID_KEYSTORE_PATH"
          printf '%s' "$MIUGRAM_ANDROID_FIREBASE_CONFIG_B64" | base64 --decode > TMessagesProj_AppStandalone/google-services.json
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace
          apk='TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk'
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          actual=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")
          test "$actual" = "$MIUGRAM_ANDROID_APPLICATION_ID.web"
          mkdir -p candidate
          cp "$apk" candidate/Miugram-Android-CANDIDATE.apk
          sha256sum candidate/Miugram-Android-CANDIDATE.apk > candidate/SHA256SUMS.txt
      - name: Upload candidate for testing only
        uses: actions/upload-artifact@v4
        with:
          name: miugram-android-untested-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 7
