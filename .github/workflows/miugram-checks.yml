name: Miugram resource checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Miugram translations
        run: |
          python3 miugram/tests/check_resources.py
          python3 miugram/tests/check_launcher_resources.py
          python3 miugram/tests/check_fork_config.py
          python3 miugram/tests/check_theme.py
          python3 miugram/tests/check_message_checks.py
          python3 miugram/tests/check_profile_background.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test ghost policy state combinations
        run: |
          mkdir -p /tmp/miugram-test
          javac -d /tmp/miugram-test TMessagesProj/src/main/java/org/telegram/messenger/MiugramGhostPolicy.java miugram/tests/MiugramGhostPolicyTest.java
          java -cp /tmp/miugram-test MiugramGhostPolicyTest
          javac -d /tmp/miugram-test TMessagesProj/src/main/java/org/telegram/messenger/MiugramAutoFrame.java miugram/tests/MiugramAutoFrameTest.java
          java -cp /tmp/miugram-test MiugramAutoFrameTest
          javac -d /tmp/miugram-test TMessagesProj/src/main/java/org/telegram/messenger/MiugramArchivePolicy.java miugram/tests/MiugramArchivePolicyTest.java
          java -cp /tmp/miugram-test MiugramArchivePolicyTest
          javac -d /tmp/miugram-test TMessagesProj/src/main/java/org/telegram/messenger/MiugramArchiveCrypto.java miugram/tests/MiugramArchiveCryptoTest.java
          java -cp /tmp/miugram-test MiugramArchiveCryptoTest
