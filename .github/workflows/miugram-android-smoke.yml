name: Miugram Android emulator startup smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Compile and launch on a fresh Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build and emulator prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1' 'emulator' 'platform-tools' \
            'system-images;android-35;google_apis;x86_64'
      - name: Compile debug APK for emulator only
        shell: bash
        env:
          MIUGRAM_TELEGRAM_API_ID: ${{ secrets.MIUGRAM_TELEGRAM_API_ID }}
          MIUGRAM_TELEGRAM_API_HASH: ${{ secrets.MIUGRAM_TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          test -n "$MIUGRAM_TELEGRAM_API_ID" && test -n "$MIUGRAM_TELEGRAM_API_HASH"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            :TMessagesProj_AppStandalone:assembleAfatDebug :TMessagesProj_AppStandalone:assembleAfatDebugAndroidTest --stacktrace
      - name: Start fresh emulator and launch Miugram
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name miugram-smoke --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd miugram-smoke -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 180); do
            if [[ $("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r') == 1 ]]; then break; fi
            if [[ "$attempt" == 180 ]]; then echo 'Emulator boot timed out' >&2; exit 1; fi
            sleep 2
          done
          adb="$ANDROID_HOME/platform-tools/adb"
          apk='TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/app.apk'
          test -f "$apk"
          package=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")
          "$adb" install -r "$apk"
          "$adb" logcat -c
          "$adb" shell monkey -p "$package" -c android.intent.category.LAUNCHER 1
          sleep 20
          pid=$("$adb" shell pidof "$package" | tr -d '\r')
          if [[ -z "$pid" ]]; then echo 'Application did not remain running after launch' >&2; exit 1; fi
          if "$adb" logcat -d --pid="$pid" -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then
            echo 'Application encountered a fatal runtime exception' >&2; exit 1
          fi
          test_apk=$(find TMessagesProj_AppStandalone/build/outputs/apk/androidTest/afat/debug -name '*.apk' -print -quit)
          test -n "$test_apk"
          "$adb" install -r "$test_apk"
          "$adb" shell am instrument -w -e class org.telegram.miugram.TextArchiveDeviceTest \
            "$package.test/androidx.test.runner.AndroidJUnitRunner" | tee "$RUNNER_TEMP/archive-test.log"
          grep -Eq '^OK \([0-9]+ tests?\)' "$RUNNER_TEMP/archive-test.log"
          if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' "$RUNNER_TEMP/archive-test.log"; then exit 1; fi
          echo 'Startup and synthetic archive test passed. Login, deletion capture, chat rendering and release packaging remain unverified.'
      # No artifact or public release: this checks only startup on an empty emulator.
